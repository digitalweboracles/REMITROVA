# Nixpacks config for RemitRova (Laravel) on Railway.
# Forces a PHP build - prevents any Node/Express misdetection.
#
# IMPORTANT: app setup (config:cache, migrate) runs in [start] (runtime),
# NOT in build - Railway only injects DB/REDIS/APP_KEY vars at runtime,
# so caching config at build would bake in empty values and crash boot.

[phases.setup]
nixPkgs = [
    "php82",
    "php82Extensions.redis",
    "php82Extensions.pdo",
    "php82Extensions.pdo_mysql",
    "php82Extensions.opcache",
    "composer",
]

[phases.install]
cmds = ["composer install --no-interaction --optimize-autoloader --no-dev"]

[start]
# [start] uses a SINGLE cmd string (not cmds array) — Nixpacks runs only
# the first entry of an array under [start]. Chain everything with ";" so
# each runs regardless of the previous, ending in the foreground server.
cmd = "php artisan migrate --force || true; php artisan config:cache || true; php artisan route:cache || true; php artisan view:cache || true; php artisan event:cache || true; php artisan storage:link || true; php artisan serve --host=0.0.0.0 --port=${PORT:-8000}"
